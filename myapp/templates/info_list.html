<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户列表</title>
</head>
<body>
    <h3>用户列表</h3>
    <a href="/info/add/">新增用户</a>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>姓名</th>
                <th>密码</th>
                <th>年龄</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for obj in data_list %}
            <tr>
                <td>{{ obj.id }}</td>
                <td>{{ obj.name }}</td>
                <td>{{ obj.password }}</td>
                <td>{{ obj.age }}</td>
                <td><a href="/info/delete/?nid={{ obj.id }}">删除</a></td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">暂无数据</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
